# OpenOCD configuration for GD32F303 with CMSIS-DAP
source [find interface/cmsis-dap.cfg]
transport select swd

# Set WORKAREASIZE to 0x2000 for flash operations
set WORKAREASIZE 0x2000

# GD32F303 device configuration
source [find target/gd32f30x.cfg]

# Reset configuration
reset_config srst_only
adapter speed 1000

# Flash configuration
flash bank gd32f30x.flash gd32f30x 0x08000000 0x00040000 0 0 $CHIPNAME.cpu